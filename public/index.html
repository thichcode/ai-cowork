<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw Studio</title>
    <style>
      :root { color-scheme: dark; --bg:#07111f; --panel:#0f172a; --line:#243041; --muted:#8da2c0; --text:#e6eef8; --accent:#38bdf8; --accent-2:#22c55e; }
      * { box-sizing: border-box; }
      body { margin:0; font-family:Inter, Arial, sans-serif; background:radial-gradient(circle at top,#0b1b31,#07111f 45%); color:var(--text); }
      .app { display:grid; grid-template-columns:360px 1fr 360px; min-height:100vh; }
      .sidebar,.inspector,.canvas { padding:20px; }
      .sidebar,.inspector { background:rgba(9,16,28,.88); }
      .sidebar { border-right:1px solid var(--line); } .inspector { border-left:1px solid var(--line); }
      .canvas { background:linear-gradient(180deg,rgba(15,23,42,.45),rgba(15,23,42,.2)); }
      .panel { background:rgba(15,23,42,.94); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:16px; box-shadow:0 10px 30px rgba(0,0,0,.2); }
      h1,h2,h3 { margin:0 0 10px; }
      .subtle { color:var(--muted); font-size:13px; line-height:1.5; }
      textarea,select,input { width:100%; background:#091221; color:var(--text); border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:8px; }
      textarea { min-height:120px; resize:vertical; }
      .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .actions { display:flex; gap:10px; margin-top:12px; }
      button { flex:1; padding:12px; border-radius:12px; border:0; cursor:pointer; font-weight:700; }
      .primary { background:linear-gradient(90deg,var(--accent),#60a5fa); color:#062033; }
      .secondary { background:#1f2937; color:var(--text); border:1px solid var(--line); }
      .hero { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:16px; }
      .hero .badge { font-size:12px; color:#062033; background:linear-gradient(90deg,var(--accent),var(--accent-2)); padding:8px 10px; border-radius:999px; font-weight:700; }
      .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
      .stat { background:rgba(15,23,42,.92); border:1px solid var(--line); border-radius:16px; padding:14px; }
      .stat b { font-size:24px; display:block; margin-top:8px; }
      .flow-board { display:grid; gap:18px; }
      .flow-row { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
      .node { min-width:150px; background:linear-gradient(180deg,#162238,#0b1322); border:1px solid #314055; border-radius:16px; padding:14px; }
      .node .title { font-weight:700; margin-bottom:4px; } .node .meta { color:var(--muted); font-size:12px; }
      .node .pill { display:inline-block; margin-top:8px; font-size:11px; padding:4px 8px; border-radius:999px; background:#0b2030; color:#7dd3fc; border:1px solid #1f516d; }
      .edge { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
      .edge .line { width:60px; height:3px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); position:relative; border-radius:999px; }
      .edge .line::after { content:''; position:absolute; right:-1px; top:-4px; border-left:9px solid var(--accent-2); border-top:5px solid transparent; border-bottom:5px solid transparent; }
      .tabs { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
      .tab { padding:8px 10px; border-radius:999px; border:1px solid var(--line); background:#0b1322; color:var(--muted); cursor:pointer; }
      .tab.active { color:var(--text); background:#162238; }
      .list { display:grid; gap:10px; } .item { border:1px solid var(--line); border-radius:14px; padding:12px; background:#0b1322; }
      pre { white-space:pre-wrap; word-break:break-word; background:#091221; border:1px solid var(--line); border-radius:14px; padding:12px; margin:0; }
      .hidden { display:none; }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="panel">
          <h2>OpenClaw Studio</h2>
          <div class="subtle">Nhập yêu cầu tại đây và cấu hình model/runtime cho từng job.</div>
          <label class="subtle">Request</label>
          <textarea id="requestInput">backup health from csv, excel and database</textarea>
          <div class="grid-2">
            <div><label class="subtle">Task type</label><select id="taskType"><option>Custom</option><option>RCA</option><option>Report</option><option>Monitoring</option></select></div>
            <div><label class="subtle">Provider</label><select id="provider"><option value="mock">Mock Runtime</option><option value="ollama">Ollama</option><option value="openai">OpenAI</option><option value="openrouter">OpenRouter</option></select></div>
          </div>
          <label class="subtle">Base URL</label><input id="baseUrl" value="http://localhost:11434" />
          <div class="grid-2"><div><label class="subtle">Model</label><input id="modelName" value="llama3.1" /></div><div><label class="subtle">Temperature</label><input id="temperature" value="0.2" /></div></div>
          <div class="grid-2"><div><label class="subtle">Planner model</label><input id="plannerModel" value="qwen2.5" /></div><div><label class="subtle">Report model</label><input id="reportModel" value="llama3.1" /></div></div>
          <div class="actions"><button class="primary" id="runBtn">Run Job</button><button class="secondary" id="clearBtn">Clear</button></div>
        </div>
      </aside>
      <main class="canvas">
        <div class="hero panel"><div><h1>Multi-Agent Flow Dashboard</h1><div class="subtle">Theo dõi job, message, task state, model config và đường đi của tín hiệu giữa các agent.</div></div><div class="badge" id="jobBadge">No job yet</div></div>
        <div class="stats" id="stats"></div>
        <div class="panel"><h3>Flow Canvas</h3><div id="graph" class="flow-board"></div></div>
      </main>
      <aside class="inspector">
        <div class="panel">
          <h3>Inspector</h3>
          <div class="tabs"><button class="tab active" data-tab="job">Job</button><button class="tab" data-tab="tasks">Tasks</button><button class="tab" data-tab="messages">Messages</button><button class="tab" data-tab="knowledge">Knowledge</button><button class="tab" data-tab="skills">Skills</button><button class="tab" data-tab="result">Result</button></div>
          <div id="tab-job" class="tab-content"></div>
          <div id="tab-tasks" class="tab-content hidden"></div>
          <div id="tab-messages" class="tab-content hidden"></div>
          <div id="tab-knowledge" class="tab-content hidden"></div>
          <div id="tab-skills" class="tab-content hidden"></div>
          <div id="tab-result" class="tab-content hidden"></div>
        </div>
      </aside>
    </div>
    <script>
      const requestInput=document.getElementById('requestInput'); const runBtn=document.getElementById('runBtn'); const clearBtn=document.getElementById('clearBtn'); const jobBadge=document.getElementById('jobBadge'); const stats=document.getElementById('stats'); const graph=document.getElementById('graph'); const provider=document.getElementById('provider'); const baseUrl=document.getElementById('baseUrl'); const modelName=document.getElementById('modelName'); const temperature=document.getElementById('temperature'); const plannerModel=document.getElementById('plannerModel'); const reportModel=document.getElementById('reportModel'); const taskType=document.getElementById('taskType');
      const tabButtons=Array.from(document.querySelectorAll('.tab')); const tabContents={job:document.getElementById('tab-job'),tasks:document.getElementById('tab-tasks'),messages:document.getElementById('tab-messages'),knowledge:document.getElementById('tab-knowledge'),skills:document.getElementById('tab-skills'),result:document.getElementById('tab-result')};
      function switchTab(name){ tabButtons.forEach(btn=>btn.classList.toggle('active',btn.dataset.tab===name)); Object.entries(tabContents).forEach(([k,el])=>el.classList.toggle('hidden',k!==name)); }
      tabButtons.forEach(btn=>btn.addEventListener('click',()=>switchTab(btn.dataset.tab)));
      function node(title,meta,pill=''){ return `<div class="node"><div class="title">${title}</div><div class="meta">${meta||''}</div>${pill?`<div class="pill">${pill}</div>`:''}</div>`; }
      function edge(label){ return `<div class="edge"><div class="line"></div><span>${label}</span></div>`; }
      function renderStats(data){ const taskCount=(data.tasks||[]).length; const messageCount=(data.messages||[]).length; const providerName=data.job?.modelConfig?.provider||'mock'; const model=data.job?.modelConfig?.model||'n/a'; stats.innerHTML=[[ 'Job status', data.job?.status||'N/A'],['Tasks',taskCount],['Messages',messageCount],['Model',`${providerName} / ${model}`]].map(([l,v])=>`<div class="stat"><div class="subtle">${l}</div><b>${v}</b></div>`).join(''); }
      function renderGraph(data){ const tasks=data.tasks||[]; const agents=[...new Set(tasks.map(t=>t.assignedAgent))]; const sources=tasks.filter(t=>t.source).map(t=>t.source); const model=data.job?.modelConfig?.model||'mock'; graph.innerHTML=`<div class="flow-row">${node('User Request',taskType.value,'input')}${edge('submit')}${node('Gateway',data.job?.id||'session','job')}${edge('plan')}${node('Planner Agent',plannerModel.value||model,'planner')}${edge('dispatch')}${node('Dispatcher','jobs / tasks / messages','runtime')}</div><div class="flow-row">${agents.map((agent,i)=>`${i?'':edge('assign')} ${node(agent,modelName.value||model,'agent')} ${edge('result')}`).join('')}</div><div class="flow-row">${sources.map((source,i)=>`${i?'':edge('fetch')} ${node(source,'data source','evidence')}`).join('')}</div>`; }
      function renderInspector(data){ tabContents.job.innerHTML=`<pre>${JSON.stringify(data.job||{},null,2)}</pre>`; tabContents.tasks.innerHTML=`<div class="list">${(data.tasks||[]).map(task=>`<div class="item"><b>${task.id}</b><div class="subtle">${task.assignedAgent} · ${task.status}</div><div>${task.goal}</div></div>`).join('')}</div>`; tabContents.messages.innerHTML=`<div class="list">${(data.messages||[]).map(msg=>`<div class="item"><b>${msg.type}</b><div class="subtle">${msg.from} → ${msg.to}</div><pre>${JSON.stringify(msg.payload||{},null,2)}</pre></div>`).join('')}</div>`; tabContents.knowledge.innerHTML=`<div class="list">${(data.knowledge||[]).map(item=>`<div class="item"><b>${item.title}</b><div class="subtle">${(item.tags||[]).join(', ')}</div><div>${item.summary}</div></div>`).join('')}</div>`; tabContents.skills.innerHTML=`<div class="list">${(data.skills||[]).map(skill=>`<div class="item"><b>${skill.name}</b><div class="subtle">${skill.id}</div><div>${skill.description}</div></div>`).join('')}</div>`; tabContents.result.innerHTML=`<pre>${JSON.stringify(data.results||[],null,2)}</pre>`; }
      function currentModelConfig(){ return { provider:provider.value, baseUrl:baseUrl.value, model:modelName.value, plannerModel:plannerModel.value, reportModel:reportModel.value, temperature:Number(temperature.value||0.2) }; }
      async function runJob(){ runBtn.disabled=true; runBtn.textContent='Running...'; try { const response=await fetch('/api/jobs',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ request:requestInput.value, taskType:taskType.value, modelConfig:currentModelConfig() }) }); const data=await response.json(); jobBadge.textContent=`${data.job?.status||'DONE'} · ${data.job?.id||''}`; renderStats(data); renderGraph(data); renderInspector(data); } catch(error){ jobBadge.textContent='ERROR'; tabContents.result.innerHTML=`<pre>${error.message}</pre>`; } finally { runBtn.disabled=false; runBtn.textContent='Run Job'; } }
      clearBtn.addEventListener('click',()=>{ requestInput.value=''; tabContents.job.innerHTML=''; tabContents.tasks.innerHTML=''; tabContents.messages.innerHTML=''; tabContents.result.innerHTML=''; graph.innerHTML=''; stats.innerHTML=''; jobBadge.textContent='No job yet'; });
      runBtn.addEventListener('click',runJob); runJob();
    </script>
  </body>
</html>
